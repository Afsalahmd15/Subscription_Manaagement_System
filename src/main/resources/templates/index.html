
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brightloop Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

    <div class="auth-container">

        <div class="auth-brand">
            <h1>Brightloop</h1>
        </div>

        <div class="auth-card">
            <h2>Welcome back</h2>
            <p class="auth-description">Sign in to continue to your account.</p>

            <form class="auth-form" th:action="@{/login}" method="post">

                <div class="form-group">
                    <label for="emailId">Email</label>
                    <input type="email" id="emailId" name="emailId"
                           placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password" required>
                </div>

                <div class="forgot-link">
                    <a th:href="@{/forgot-password}">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary btn-full">
                    Login
                </button>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a th:href="@{/register}">Create an account</a>
            </p>
        </div>

    </div>

    <script th:if="${LoginFailed}" th:inline="javascript">
        alert("[[${LoginFailed}]]");
    </script>

    <script th:if="${registerUserSuccess}">
        alert("[[${registerUserSuccess}]]");
    </script>

</body>
</html>
