
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brightloop Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

    <div class="auth-container">

        <div class="auth-brand">
            <h1>Brightloop</h1>
            <p>Subscription management made simple.</p>
        </div>

        <div class="auth-card">
            <h2>Create an account</h2>
            <p class="auth-description">Register to get started with Brightloop.</p>

            <form class="auth-form" th:action="@{/register}" method="post">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Create a password" required>

                    <div class="show-password">
                        <input type="checkbox" id="showPassword">
                        <label for="showPassword">Show Password</label>
                    </div>

                    <ul class="password-rules">
                        <li id="length">At least 9 characters</li>
                        <li id="uppercase">One uppercase letter (A-Z)</li>
                        <li id="lowercase">One lowercase letter (a-z)</li>
                        <li id="special">One special character (@, #, $, !)</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword"
                           name="confirmPassword"
                           placeholder="Re-enter your password" required>

                    <div class="show-password">
                        <input type="checkbox" id="showConfirmPassword">
                        <label for="showConfirmPassword">Show Password</label>
                    </div>
                </div>

                <button type="submit" class="btn-primary btn-full">
                    Create Account
                </button>

            </form>

            <p class="auth-footer">
                Already have an account?
                <a th:href="@{/}">Login</a>
            </p>
        </div>
    </div>

    <script>
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const form = document.querySelector("form");

        document.getElementById("showPassword")
            .addEventListener("change", function () {
                password.type = this.checked ? "text" : "password";
            });

        document.getElementById("showConfirmPassword")
            .addEventListener("change", function () {
                confirmPassword.type = this.checked ? "text" : "password";
            });

        password.addEventListener("input", function () {
            const value = password.value;

            document.getElementById("length").style.color =
                value.length >= 9 ? "green" : "red";

            document.getElementById("uppercase").style.color =
                /[A-Z]/.test(value) ? "green" : "red";

            document.getElementById("lowercase").style.color =
                /[a-z]/.test(value) ? "green" : "red";

            document.getElementById("special").style.color =
                /[^a-zA-Z0-9]/.test(value) ? "green" : "red";
        });

        form.addEventListener("submit", function (event) {
            const value = password.value;

            const valid =
                value.length >= 9 &&
                /[A-Z]/.test(value) &&
                /[a-z]/.test(value) &&
                /[^a-zA-Z0-9]/.test(value);

            if (!valid) {
                event.preventDefault();
                alert("Please satisfy all password requirements!");
                return;
            }

            if (value !== confirmPassword.value) {
                event.preventDefault();
                alert("Passwords do not match!");
            }
        });
    </script>

    <script th:if="${registerFailed}">
        alert("[[${registerFailed}]]");
    </script>

</body>
</html>
